name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            ai:
              - 'ai/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # a stalled install fails the job instead of running until github's 6h limit
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # matches the frontend Dockerfile (node:24-alpine) the lockfile was made with
          node-version: '24'
          # Empty string ('') disables caching cleanly until frontend/package-lock.json
          # exists; once it's committed, hashFiles finds it and caching turns itself on.
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # npm prints nothing while it downloads (~480 packages), so a slow install looks
        # stuck. The cache above serves tarballs offline; skipping the audit and funding
        # lookups saves more round trips
        timeout-minutes: 10
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The test suite needs real Postgres and Redis; POSTGRES_DB creates the
    # database that ASYNC_TEST_DB_URL points at.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: disputepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Placeholder settings so app.core.config.Settings loads in CI. These are
    # not real credentials. Only the test DB and Redis are backed by the
    # services above; nothing else should be reached during tests.
    env:
      ENVIRONMENT: test
      ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/disputepilot  # pragma: allowlist secret
      SYNC_DB_URL: postgresql://postgres:postgres@localhost:5432/disputepilot  # pragma: allowlist secret
      ASYNC_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/disputepilot_test  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      BROKER_URL: amqp://guest:guest@localhost:5672//  # pragma: allowlist secret
      API_EMAIL: ci@example.com
      RESEND_API_KEY: ci-resend-api-key  # pragma: allowlist secret
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ACCESS_TOKEN_EXPIRE_TIME: 15
      REFRESH_TOKEN_EXPIRE_TIME: 7
      ACCESS_TOKEN_SECRET_KEY: ci-access-token-secret-not-for-production  # pragma: allowlist secret
      REFRESH_TOKEN_SECRET_KEY: ci-refresh-token-secret-not-for-production  # pragma: allowlist secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret  # pragma: allowlist secret
      ARGON2_PASSWORD_PEPPER: ci-argon2-pepper  # pragma: allowlist secret
      SESSION_SECRET_KEY: ci-session-secret-key  # pragma: allowlist secret
      OTP_SECRET_KEY: ci-otp-secret-key   # pragma: allowlist secret
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci-minio-access-key  # pragma: allowlist secret
      MINIO_SECRET_KEY: ci-minio-secret-key  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # weasyprint prints the evidence pdfs with pango
      - name: Install pdf libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Dependency vulnerability audit
        run: uv run pip-audit

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
