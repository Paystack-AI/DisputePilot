[project]
name = "backend"
version = "0.1.0"
description = "API/server team"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "cryptography>=50.0.1",
    "fastapi-limiter>=0.2.0",
    "fastapi[all]>=0.115",
    "psycopg2>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pyrate-limiter",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope= "session"
asyncio_default_test_loop_scope= "session"
