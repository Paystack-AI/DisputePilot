[project]
name = "backend"
version = "0.1.0"
description = "API/server team"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "fastapi-limiter>=0.2.0",
    "fastapi[all]>=0.115",
    "gevent>=26.9.0",
    "jinja2>=3.1.6",
    "minio>=7.2.20",
    "phonenumbers>=9.0.41",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "psycopg2>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pyrate-limiter",
    "redis>=8.1.0",
    "resend>=2.49.1",
    "sentry-sdk>=2.70.0",
    "sqlalchemy>=2.0.54",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rate_limited: run the test with the real rate limiters enabled"
]
asyncio_default_fixture_loop_scope= "session"
asyncio_default_test_loop_scope= "session"
