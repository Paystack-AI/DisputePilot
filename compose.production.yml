name: disputepilot

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:4.0-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env.production}
      RABBITMQ_DEFAULT_VHOST: disputepilot
    volumes:
      - broker_data:/var/lib/rabbitmq
    networks: [app]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  storage:
    image: ${S3_IMAGE:?Set S3_IMAGE to a pinned S3-compatible image in .env.production}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.production}
    entrypoint: ["/usr/bin/docker-entrypoint.sh"]
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - storage_data:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.production
    environment:
      MINIO_ENDPOINT: storage:9000
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy

  declare_queues:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.production
    command: ["python", "-m", "app.worker.declare_queues"]
    restart: "no"
    networks: [app]
    depends_on:
      broker:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      MINIO_ENDPOINT: storage:9000
      BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@broker:5672/disputepilot
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    networks: [app, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      MINIO_ENDPOINT: storage:9000
      BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@broker:5672/disputepilot
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "disputepilot.celery", "-P", "gevent", "-l", "info"]
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      declare_queues:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@broker:5672/disputepilot
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-s", "/beat/celerybeat-schedule", "-l", "info"]
    volumes:
      - beat_data:/beat
    networks: [app]
    depends_on:
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      declare_queues:
        condition: service_completed_successfully

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./ai/.env.production
    environment:
      REDIS_URL: redis://redis:6379/0
    networks: [app]
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.production}
      REFRESH_TOKEN_EXPIRE_TIME: ${REFRESH_TOKEN_EXPIRE_TIME:?Set REFRESH_TOKEN_EXPIRE_TIME in .env.production}
    networks: [app, edge]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

networks:
  app: {}
  edge: {}

volumes:
  postgres_data:
  redis_data:
  broker_data:
  storage_data:
  beat_data:
  caddy_data:
  caddy_config:
